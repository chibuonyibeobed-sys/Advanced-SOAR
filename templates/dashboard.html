<!DOCTYPE html><html><head><title>SOC Dashboard</title><meta http-equiv="refresh" content="3">
<style>body{background:#000;color:#0f0;font-family:monospace;padding:20px}h1{border-bottom:2px solid #0f0}
.alert{border-left:3px solid #0f0;padding:8px;margin:5px 0;background:#111}.critical{border-color:red;color:red}</style></head><body>
<h1>ADVANCED-SOAR SOC DASHBOARD</h1><h3>BLOCKED IPs</h3>{% for ip in blocked %}<div class="critical">{{ip}}</div>{% endfor %}
<h3>LIVE ALERTS</h3>{% for a in alerts %}<div class="alert {% if a.level=='CRITICAL' %}critical{% endif %}">[{{a.time}}] {{a.msg}}</div>{% endfor %}</body></html>
